<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathematical Atlas</title>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg-panel: rgba(12, 16, 26, 0.65);
      --bg-panel-border: rgba(255, 255, 255, 0.12);
      --bg-input: rgba(4, 8, 18, 0.6);
      --accent: #8ee3ff;
      --accent-glow: rgba(142, 227, 255, 0.25);
      --text-main: #f0f4fc;
      --text-muted: rgba(240, 244, 252, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #04060a;
      color: var(--text-main);
    }

    #viz-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Glassmorphism Panel Base */
    .glass-panel {
      background: var(--bg-panel);
      border: 1px solid var(--bg-panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    /* HUD Layout Overlay */
    #hud-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      grid-template-rows: auto 1fr;
      gap: 16px;
      padding: 20px;
    }

    .hud-interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    #top-bar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .mode-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--bg-panel-border);
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      color: var(--text-main);
    }

    .mode-btn.active {
      background: var(--accent);
      color: #040812;
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Left Controls Panel */
    #control-panel {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      align-self: start;
    }

    .panel-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .field-value {
      color: var(--accent);
      font-family: monospace;
    }

    .expression-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--bg-panel-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .expression-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    input[type='range'] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Right Inspector Panel */
    #inspector-panel {
      grid-column: 3;
      grid-row: 2;
      padding: 20px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .readout-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px;
      border-radius: 10px;
    }

    .readout-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .readout-value {
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- WebGL Canvas Anchor -->
  <canvas id="viz-canvas"></canvas>

  <!-- UI HUD Overlay -->
  <div id="hud-overlay">
    <header id="top-bar" class="glass-panel hud-interactive">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>Math Visualizer</span>
      </div>
      <nav class="mode-selector">
        <button class="mode-btn active" data-mode="0">Complex Domain</button>
        <button class="mode-btn" data-mode="1">Fractals</button>
        <button class="mode-btn" data-mode="2">Flow Fields</button>
        <button class="mode-btn" data-mode="3">Linear Algebra</button>
      </nav>
    </header>

    <aside id="control-panel" class="glass-panel hud-interactive">
      <span class="panel-title">Function Input</span>
      <div class="field-group">
        <div class="field-label"><span>Formula f(z)</span></div>
        <input type="text" id="expr-input" class="expression-input" value="z^3 - 1" spellcheck="false" />
      </div>

      <span class="panel-title">Parameters</span>
      <div class="field-group">
        <div class="field-label"><span>Time Speed</span><span id="speed-val" class="field-value">1.0</span></div>
        <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1.0" />
      </div>
    </aside>

    <aside id="inspector-panel" class="glass-panel hud-interactive">
      <span class="panel-title">Realtime Readout</span>
      <div class="readout-card">
        <div class="readout-label">Cursor Position (z)</div>
        <div id="readout-z" class="readout-value">0.00 + 0.00i</div>
      </div>
      <div class="readout-card">
        <div class="readout-label">Calculated f(z)</div>
        <div id="readout-fz" class="readout-value">0.00 + 0.00i</div>
      </div>
    </aside>
  </div>

  <script>
    // --- GLSL Shaders ---
    const vertShader = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragShader = /* glsl */ `
      precision highp float;

      uniform vec2 u_resolution;
      uniform vec2 u_offset;
      uniform float u_zoom;
      uniform float u_time;
      uniform int u_mode;

      #define PI 3.14159265359

      vec3 hsl2rgb(vec3 c) {
        vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
        return c.z + c.y * (rgb - 0.5) * (1.0 - abs(2.0 * c.z - 1.0));
      }

      vec3 renderComplexDomain(vec2 z) {
        vec2 z3 = vec2(z.x*z.x*z.x - 3.0*z.x*z.y*z.y, 3.0*z.x*z.x*z.y - z.y*z.y*z.y);
        vec2 fz = z3 - vec2(1.0 - 0.3 * sin(u_time), 0.0);

        float r = length(fz);
        float theta = atan(fz.y, fz.x);
        if (theta < 0.0) theta += 2.0 * PI;

        float logR = log(r + 1.0);
        float val = 0.5 + 0.5 * sin(2.0 * PI * logR);
        float grid = abs(fract(logR * 2.0 - 0.5) - 0.5) / fwidth(logR * 2.0);
        val *= clamp(grid, 0.4, 1.0);

        return hsl2rgb(vec3(theta / (2.0 * PI), 0.85, clamp(val * 0.6, 0.15, 0.85)));
      }

      vec3 renderFractal(vec2 c) {
        vec2 z = c;
        float n = 0.0;
        for (float i = 0.0; i < 128.0; i++) {
          if (dot(z, z) > 4.0) break;
          z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
          n += 1.0;
        }
        if (n >= 128.0) return vec3(0.0);
        float nu = log(log(dot(z, z)) / 2.0) / log(2.0);
        return hsl2rgb(vec3((n + 1.0 - nu) * 0.05 + u_time * 0.05, 0.8, 0.5));
      }

      vec3 renderFlowField(vec2 p) {
        vec2 v = vec2(sin(p.y + u_time), cos(p.x + u_time));
        float speed = length(v);
        float angle = atan(v.y, v.x);
        if (angle < 0.0) angle += 2.0 * PI;
        vec3 baseColor = hsl2rgb(vec3(angle / (2.0 * PI), 0.7, 0.5 * speed));
        vec2 st = fract(p);
        float lines = step(0.95, st.x) + step(0.95, st.y);
        return mix(baseColor, vec3(1.0), lines * 0.3);
      }

      vec3 renderLinearTransform(vec2 p) {
        float a = u_time * 0.5;
        mat2 m = mat2(cos(a), sin(a), -sin(a), cos(a));
        vec2 transformed = m * p;
        vec2 grid = abs(fract(transformed - 0.5) - 0.5) / fwidth(transformed);
        float line = min(grid.x, grid.y);
        float color = 1.0 - min(line, 1.0);
        vec3 axisColor = vec3(0.1, 0.1, 0.15);
        if (abs(transformed.x) < 0.05) axisColor = vec3(0.2, 0.8, 1.0);
        if (abs(transformed.y) < 0.05) axisColor = vec3(1.0, 0.3, 0.4);
        return mix(axisColor, vec3(0.9), color);
      }

      void main() {
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec2 pos = st * u_zoom + u_offset;

        vec3 col = vec3(0.0);
        if (u_mode == 0) col = renderComplexDomain(pos);
        else if (u_mode == 1) col = renderFractal(pos);
        else if (u_mode == 2) col = renderFlowField(pos);
        else if (u_mode == 3) col = renderLinearTransform(pos);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    // --- State & Engine Setup ---
    const state = {
      mode: 0,
      zoom: 4.0,
      speed: 1.0,
      offset: new THREE.Vector2(0, 0)
    };

    const canvas = document.querySelector('#viz-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const uniforms = {
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_offset: { value: state.offset },
      u_zoom: { value: state.zoom },
      u_time: { value: 0 },
      u_mode: { value: state.mode }
    };

    const material = new THREE.ShaderMaterial({
      vertexShader: vertShader,
      fragmentShader: fragShader,
      uniforms
    });

    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    // --- UI Controls Handler ---
    const modeBtns = document.querySelectorAll('.mode-btn');
    modeBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        modeBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = parseInt(btn.dataset.mode, 10);
        uniforms.u_mode.value = state.mode;
      });
    });

    const speedSlider = document.querySelector('#speed-slider');
    const speedVal = document.querySelector('#speed-val');
    speedSlider.addEventListener('input', (e) => {
      state.speed = parseFloat(e.target.value);
      speedVal.textContent = state.speed.toFixed(1);
    });

    // --- Interactive Pan & Zoom ---
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.hud-interactive')) return;
      isDragging = true;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
      if (isDragging) {
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        state.offset.x -= (dx / window.innerHeight) * state.zoom;
        state.offset.y += (dy / window.innerHeight) * state.zoom;
        prevMouse = { x: e.clientX, y: e.clientY };
      }

      // Cursor readout
      const aspect = window.innerWidth / window.innerHeight;
      const zReal = ((e.clientX / window.innerWidth) * 2 - 1) * state.zoom * aspect + state.offset.x;
      const zImag = -((e.clientY / window.innerHeight) * 2 - 1) * state.zoom + state.offset.y;
      
      document.querySelector('#readout-z').textContent = 
        `${zReal.toFixed(2)} ${zImag >= 0 ? '+' : '-'} ${Math.abs(zImag).toFixed(2)}i`;
      document.querySelector('#readout-fz').textContent = 
        `${(zReal*zReal - zImag*zImag).toFixed(2)} ${(2*zReal*zImag) >= 0 ? '+' : '-'} ${Math.abs(2*zReal*zImag).toFixed(2)}i`;
    });

    window.addEventListener('pointerup', () => (isDragging = false));

    window.addEventListener('wheel', (e) => {
      const factor = e.deltaY > 0 ? 1.08 : 0.92;
      state.zoom = Math.max(0.01, Math.min(100.0, state.zoom * factor));
      uniforms.u_zoom.value = state.zoom;
    }, { passive: true });

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    // --- Render Loop ---
    const clock = new THREE.Clock();
    let elapsedTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      elapsedTime += clock.getDelta() * state.speed;
      uniforms.u_time.value = elapsedTime;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
